<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логин болон Бүртгэл</title>
</head>
<body>
    <!-- Логин хэлбэр -->
    <form class="login-form">
        <h2>Логин</h2>

        <!-- Имэйл хаяг оруулах input талбар -->
        <label for="login-email">Имэйл хаяг:</label>
        <input type="email" id="login-email" name="login-email" required>

        <!-- Нууц үг оруулах input талбар -->
        <label for="login-password">Нууц үг:</label>
        <input type="password" id="login-password" name="login-password" required>

        <!-- Логин хийх товч -->
        <button type="submit">Логин хийх</button>
    </form>

    <!-- Бүртгэл хэлбэр -->
    <form class="signup-form">
        <h2>Бүртгүүлэх</h2>

        <!-- Нэр оруулах input талбар -->
        <label for="signup-name">Нэр:</label>
        <input type="text" id="signup-name" name="signup-name" required>

        <!-- Имэйл хаяг оруулах input талбар -->
        <label for="signup-email">Имэйл хаяг:</label>
        <input type="email" id="signup-email" name="signup-email" required>

        <!-- Нууц үг оруулах input талбар -->
        <label for="signup-password">Нууц үг:</label>
        <input type="password" id="signup-password" name="signup-password" required>

        <!-- Хүйс сонгох select талбар -->
        <label for="signup-gender">Хүйс:</label>
        <select id="signup-gender" name="signup-gender">
            <option value="male">Эр</option>
            <option value="female">Эм</option>
            <option value="other">Бусад</option>
        </select>

        <!-- Тайлбар оруулах textarea талбар -->
        <label for="signup-message">Тайлбар (Сонголт):</label>
        <textarea id="signup-message" name="signup-message" rows="4" cols="50"></textarea>

        <!-- Бүртгүүлэх товч -->
        <button type="submit">Бүртгүүлэх</button>
    </form>
</body>
</html>
